# AWGN channel, QPSK (low MCS) single-layer link
snr_db: [-2, -1, 0, 1, 2, 3, 4, 5, 6, 7, 8]
num_trials: 200
batch_size: 32
device: auto  # auto = cuda:0 if available, else cpu
seed: 7

carrier:
  subcarrier_spacing: 30.0
  n_size_grid: 4
  n_cell_id: 1

pusch:
  num_layers: 1
  num_antenna_ports: 1
  mapping_type: "A"
  symbol_start: 0
  symbol_length: 14
  precoding: "non-codebook"

tb:
  mcs_index: 6          # QPSK, mid rate
  mcs_table: 1

channel:
  channel_type: "awgn"
  model: "C"
  delay_spread: 100e-9
  carrier_frequency: 3.5e9
