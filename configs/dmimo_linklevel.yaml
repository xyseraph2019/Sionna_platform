# Link-level DMIMO scenario (used by examples/dmimo_linklevel_cfg.py)
channel_kind: "cdl"        # simple | tdl | cdl | uma | umi
cdl_model: "C"            # CDL 模型：A/B/C/D/E（channel_kind=cdl 时生效）
tdl_model: "C"            # TDL 模型：A/B/C/D/E（channel_kind=tdl 时生效）
num_trps: 3
num_tx_ant: 32
num_ue_ant: 4              # >= rank (UE antennas for multi-stream)
n_subcarriers: 240
subcarrier_spacing_khz: 30.0
carrier_frequency: 3.5e9
pathloss: false            # true: include per-TRP pathloss/coverage

trp_distances_m: [100, 200, 350]
tau_ns: [0, 130, 260]      # per-TRP timing offset (ns), TRP0=0
cal_amp_error: 0.1         # None -> no calibration error
cal_pha_error: 0.1
granularity: "SC"          # SC | RB | SC_RB_granular
subband_size: 12           # CJT 与 NN-PMI 统一预编码粒度（每子带子载波数；后续可改 48）

rank: 2                    # number of streams (1..4)
qam_order: 16
code_rate: 0.5

# P1: DMRS-like pilots + LS channel estimation (false = perfect CSI)
use_channel_estimation: true
est_density: 0.5           # DMRS comb density in the DMRS symbol (pilots/subcarrier)
pilot_boost_db: 0.0        # P1: DMRS pilot energy boost (dB) vs a data symbol
# P1: time-frequency resource grid (pilots and data in separate symbols)
n_symbols: 14              # OFDM symbols per slot
dmrs_symbol: 2             # front-loaded pilot-only DMRS symbol (mapping type A)
num_dmrs_symbols: 2        # >=2 with rank>=2: interleaved comb -> full per-stream pilot coverage (no frequency-interp floor)
# P2: 5G NR transport-block encoder/decoder with TB CRC error detection
use_crc: true

precoder: "all"            # mrt | cjt | type1 | all | nn
nn_pmi_ckpt: "auto"  # auto = 根据 num_trps/rank/n_subcarriers/qam/code_rate 等自动匹配 out/dmimo/model/nn_pmi_mixer_<tag>.pt

# SNR sweep range (dB): start, stop, step.
# Use a plain `snr_db: [-24, -22, ...]` list to override the generated grid.
# -16..10 covers the full CJT waterfall (3TRP coherent ~-16..-8 dB, 3TRP+err
# ~-12..-4 dB, single TRP ~-8..0 dB) plus the zero-BLER high-SNR region.
snr_start_db: -16
snr_stop_db: 0
snr_step_db: 2
num_trials: 128
num_mc_batches: 5  # 每个 SNR 下跑的蒙特卡洛批次数；总 TB 数 = num_trials * num_mc_batches
device: "auto"
seed: 0
